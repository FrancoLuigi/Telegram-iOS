name: Build Telegram iOS (test personale)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26  
    timeout-minutes: 300  # build Bazel può richiedere ore

    steps:
      - name: Checkout con submoduli
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepara configurazione
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BUNDLE_ID: ${{ secrets.TG_BUNDLE_ID }}
        run: |
          mkdir -p $HOME/telegram-configuration
          cp -R build-system/example-configuration/* $HOME/telegram-configuration/
          sed -i '' "s/API_ID = .*/API_ID = \"${TG_API_ID}\"/" $HOME/telegram-configuration/variables.bzl
          sed -i '' "s/API_HASH = .*/API_HASH = \"${TG_API_HASH}\"/" $HOME/telegram-configuration/variables.bzl
          sed -i '' "s/BUNDLE_ID = .*/BUNDLE_ID = \"${TG_BUNDLE_ID}\"/" $HOME/telegram-configuration/variables.bzl

      - name: Importa certificati fake per unsigned build
        run: |
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Build (senza firma reale - solo per verificare che compili)
        run: |
          mkdir -p "$HOME/telegram-bazel-cache"
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath="$HOME/telegram-configuration" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=100001 \
            --configuration=release_arm64

      - name: Carica IPA come artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-test-build
          path: bazel-out/**/bin/Telegram/*.ipa
          retention-days: 7
