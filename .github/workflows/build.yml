name: Build Telegram iOS (test personale)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 300

    steps:
      - name: Checkout con submoduli
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Seleziona Xcode 26.2 e accetta licenza
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          sudo xcodebuild -license accept

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ispeziona configurazione di esempio
        run: |
          echo "--- Contenuto della cartella example-configuration ---"
          ls -la build-system/example-configuration/
          echo "--- File .json trovati ---"
          find build-system/example-configuration/ -name "*.json"

      - name: Cerca file di configurazione JSON nel repo
        run: |
          echo "--- Tutti i .json in build-system ---"
          find build-system -maxdepth 2 -name "*.json"
          echo ""
          echo "--- Contenuto di ciascuno ---"
          for f in $(find build-system -maxdepth 2 -name "*.json"); do
            echo "=== $f ==="
            cat "$f"
            echo ""
          done

      - name: Prepara configurazione
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          mkdir -p $HOME/telegram-configuration
          jq \
            --arg api_id "$TG_API_ID" \
            --arg api_hash "$TG_API_HASH" \
            '.api_id = $api_id | .api_hash = $api_hash' \
            build-system/appstore-configuration.json \
            > $HOME/telegram-configuration/configuration.json
          echo "--- Configurazione generata ---"
          cat $HOME/telegram-configuration/configuration.json
          echo "CONFIG_FILE=$HOME/telegram-configuration/configuration.json" >> $GITHUB_ENV
      - name: Importa certificati fake per unsigned build
        run: |
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Build (senza firma reale - solo per verificare che compili)
        run: |
          mkdir -p "$HOME/telegram-bazel-cache"
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath="${CONFIG_FILE}" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=100001 \
            --configuration=release_arm64

      - name: Carica IPA come artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-test-build
          path: bazel-out/**/bin/Telegram/*.ipa
          retention-days: 7
